<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رنگ و رزین</title>
<meta name="description" content="بازار مواد اولیه رنگ و رزین ایران: شکاف ساختاری و جنگی، مواد و برندها">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رنگ و رزین">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="vazirmatn-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 id="app-title">بازار مواد اولیه رنگ و رزین</h1>
  </div>
  <div class="seg" role="radiogroup" aria-label="سناریو" id="seg">
    <button type="button" role="radio" data-s="a" aria-checked="true">الف · وضع موجود</button>
    <button type="button" role="radio" data-s="b" aria-checked="false">ب · عادی‌سازی</button>
  </div>
</header>

<main>
  <section class="view" id="v-industry" aria-label="صنعت"></section>
  <section class="view" id="v-materials" aria-label="مواد اولیه" hidden></section>
  <section class="view" id="v-brands" aria-label="برندها" hidden></section>
  <section class="view" id="v-method" aria-label="روش" hidden></section>
</main>

<nav class="tabbar" role="tablist" aria-label="بخش‌ها">
  <button type="button" role="tab" data-v="industry" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V10l5 3V10l5 3V6l4 2v13"/></svg>
    <span>صنعت</span>
  </button>
  <button type="button" role="tab" data-v="materials" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7.5 14h9"/></svg>
    <span>مواد اولیه</span>
  </button>
  <button type="button" role="tab" data-v="brands" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    <span>برندها</span>
  </button>
  <button type="button" role="tab" data-v="method" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg>
    <span>روش</span>
  </button>
</nav>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-top">
    <button type="button" class="back" id="sheet-back" aria-label="بازگشت">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      بازگشت
    </button>
    <div class="sheet-title" id="sheet-title"></div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
